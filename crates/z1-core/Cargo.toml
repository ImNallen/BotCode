[package]
name = "z1-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
rusqlite = { version = "0.38", features = ["bundled"] }
libc = "0.2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tempfile = "3"
portable-pty = "0.9"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
